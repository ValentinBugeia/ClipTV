# Déploiement 24h/24 sur un serveur (VPS) — voir README, section « Déploiement ».
#
#   docker compose up -d                       l'app (interface web + pilote auto + publication)
#   docker compose --profile https up -d       + HTTPS automatique sur CLIPBOT_DOMAIN
#
# Ensuite tout se fait dans le navigateur : https://<CLIPBOT_DOMAIN> (ou http://<ip>:8000).

services:
  app:
    image: ghcr.io/valentinbugeia/cliptv:latest
    build: .
    command: app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      CLIPBOT_AUTOPILOT: ${CLIPBOT_AUTOPILOT:-1}
    volumes:
      - ./data:/data
    ports:
      # avec le profil https, mets CLIPBOT_BIND=127.0.0.1 : seul Caddy reste exposé
      - "${CLIPBOT_BIND:-0.0.0.0}:${CLIPBOT_PORT:-8000}:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # HTTPS (certificat Let's Encrypt automatique) : le DNS de CLIPBOT_DOMAIN doit pointer
  # vers le serveur, ports 80 et 443 ouverts.
  https:
    image: caddy:2
    profiles: [https]
    command: caddy reverse-proxy --from ${CLIPBOT_DOMAIN:-localhost} --to app:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  caddy-data:
