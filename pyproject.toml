[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipbot"
version = "0.2.0"
description = "Clips Twitch viraux → format vertical sous-titré → TikTok"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
face = ["opencv-python-headless>=4.8"]
ai = ["anthropic>=1.11"]
all = ["opencv-python-headless>=4.8", "anthropic>=1.11"]
dev = ["pytest>=8"]

[project.scripts]
clipbot = "clipbot.cli:main"

[tool.setuptools]
packages = ["clipbot"]
