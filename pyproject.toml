[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipbot"
version = "0.3.0"
description = "Clips Twitch viraux → vidéos verticales sous-titrées → TikTok, YouTube Shorts, Reels"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0",
    "python-dotenv>=1.0",
    "tzdata",  # fuseaux horaires (Windows, images Docker minimales)
]

[project.optional-dependencies]
face = ["opencv-python-headless>=4.8,<5"]
ai = ["anthropic>=1.11"]
all = ["opencv-python-headless>=4.8,<5", "anthropic>=1.11"]
dev = ["pytest>=8"]

[project.scripts]
clipbot = "clipbot.cli:main"

[tool.setuptools]
packages = ["clipbot"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
